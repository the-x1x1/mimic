name: Nightly smoke

# Windows debug build plus the packaged-engine smoke, on a schedule, so
# platform regressions surface before a release tag. The import, voice and
# generation pipeline is covered by `cargo test --workspace`, which runs here
# too. Never publishes.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  windows-debug-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pnpm install --frozen-lockfile
      - run: cd engine; uv sync --all-extras --dev; uv run pytest
        shell: pwsh
      - run: pwsh -NoProfile -File scripts/package-engine.ps1
        shell: pwsh
      - run: cargo test --workspace
      - run: pnpm --filter @mimic/desktop tauri build --debug --no-bundle
      - name: Packaged engine answers its own protocol
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/resources/engine -Filter "mimic-engine.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "packaged engine missing" }
          $hello = '{"protocolVersion":1,"requestId":"1","method":"engine.hello","params":{}}'
          $resp = (($hello | & $exe.FullName serve) -join "`n")
          if ($LASTEXITCODE -ne 0) { throw "packaged engine exited with $LASTEXITCODE" }
          if ($resp -notmatch '"engineVersion"' -or $resp -notmatch '"protocolVersion":1') { throw "packaged engine did not answer engine.hello: $resp" }
      - name: Debug binary exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/debug -Filter "mimic-desktop.exe" | Select-Object -First 1
          if (-not $exe) { throw "debug binary missing" }
          Write-Host "built $($exe.FullName)"
