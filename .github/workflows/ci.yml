name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-version.mjs --check
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @mimic/desktop build

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Engine env (for the real-engine e2e test)
        run: cd engine && uv sync --all-extras --dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python engine (ruff · pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: cd engine && uv sync --all-extras --dev
      - run: cd engine && uv run ruff check .
      - run: cd engine && uv run ruff format --check .
      - run: cd engine && uv run pytest

  security:
    name: Security (audit · secrets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit || echo "::warning::cargo audit reported advisories (non-blocking in 0.x)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high || echo "::warning::pnpm audit reported advisories (non-blocking in 0.x)"
      - name: No committed secrets
        run: |
          set -e
          if git grep -nE "untrusted comment: rustsigner encrypted secret key|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY" -- . ':!docs/**' ':!.github/**'; then
            echo "::error::private key material committed"; exit 1; fi
          if git grep -nE "ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}" -- .; then
            echo "::error::GitHub token committed"; exit 1; fi
          echo "no secrets found"
