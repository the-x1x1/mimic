name: Release

# Tag vX.Y.Z on main (after CI is green) → Windows x64 installer, signed
# updater artifact, latest.json, checksums, GitHub Release (draft first; the
# release block flips it to published after verification).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# One run per tag at a time. GitHub started two runs for the one push of
# v0.10.0-alpha.9, and each made a draft release. Now the second waits, then
# finds the first one's release and stops ("No release for this tag yet").
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag matches sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must equal package version
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$V"; exit 1; }
          node scripts/sync-version.mjs --check
      - name: Updater key must not be the development key for non-alpha tags
        run: |
          if ! echo "${GITHUB_REF_NAME}" | grep -q alpha; then
            PUB=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey.trim()")
            DEV=$(tr -d '\n' < docs/DEV_UPDATER_PUBKEY.txt)
            [ "$PUB" != "$DEV" ] || { echo "development updater pubkey in tauri.conf.json"; exit 1; }
          fi
      - name: No release for this tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A second run for the tag stops here, before building anything.
          # Only "not found" means there is none: any other failure to look
          # stops the run too, rather than risk a second release.
          if out=$(gh release view "${GITHUB_REF_NAME}" --json tagName 2>&1); then
            echo "::error::A release for ${GITHUB_REF_NAME} already exists; not making a second one."
            exit 1
          elif ! echo "$out" | grep -q "release not found"; then
            echo "::error::Couldn't check for a release for ${GITHUB_REF_NAME}: $out"
            exit 1
          fi

  windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-2022
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - id: v
        shell: pwsh
        run: '"version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'
      - run: pnpm install --frozen-lockfile
      - name: Tests (fast subset; full CI already ran on the branch)
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test
          cd engine; uv sync --all-extras --dev; uv run pytest; cd ..
          # After the engine environment exists, so the four engine-protocol
          # tests run against a real child process instead of skipping.
          cargo test --workspace
      - name: Package engine
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package-engine.ps1
      - name: Build Tauri app (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY secret is not set; refusing to publish an unsignable release" }
          pnpm --filter @mimic/desktop tauri build --ci
      - name: The installer actually contains the engine
        shell: pwsh
        run: |
          $engine = Get-ChildItem apps/desktop/src-tauri/resources/engine -Filter "mimic-engine.exe" -Recurse | Select-Object -First 1
          if (-not $engine) { throw "the bundle was built without a packaged engine" }
          $nsis = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "no installer was produced" }
          if ($nsis.Length -lt 20MB) { throw "installer is $([int]($nsis.Length/1MB)) MB; too small to contain the engine" }
      - name: Collect artifacts + latest.json + checksums
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $out = "release-artifacts"; New-Item -ItemType Directory -Force $out | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $nsis -or -not $sig) { throw "installer or signature missing" }
          Copy-Item $nsis.FullName (Join-Path $out "Mimic_${v}_x64-setup.exe")
          Copy-Item $sig.FullName (Join-Path $out "Mimic_${v}_x64-setup.exe.sig")
          $notes = (Get-Content CHANGELOG.md -Raw) -split "`n## \[" | Where-Object { $_ -like "$v]*" } | Select-Object -First 1
          $latest = @{
            version = $v
            notes = ("## [" + $notes).Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = (Get-Content $sig.FullName -Raw).Trim(); url = "https://github.com/the-x1x1/mimic/releases/download/v$v/Mimic_${v}_x64-setup.exe" } }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out "latest.json") -Encoding utf8
          Get-ChildItem $out -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content (Join-Path $out "SHA256SUMS.txt") -Encoding ascii
          Get-ChildItem $out
      - name: Validate latest.json shape
        shell: pwsh
        run: |
          $l = Get-Content release-artifacts/latest.json -Raw | ConvertFrom-Json
          if ($l.version -ne "${{ steps.v.outputs.version }}") { throw "latest.json version mismatch" }
          if (-not $l.platforms.'windows-x86_64'.signature) { throw "latest.json signature missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/

  publish:
    name: Publish GitHub Release (draft)
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.windows.outputs.version }}"
          PRE=""; echo "$V" | grep -qE "alpha|beta|rc" && PRE="--prerelease"
          awk -v v="$V" 'BEGIN{p=0} /^## \[/{p=($0 ~ "\\[" v "\\]")} p' CHANGELOG.md > notes.md
          # A draft doesn't reserve its tag, so GitHub would take a second
          # release for it. If one is there, from another run, stop; a broken
          # draft from a failed run is deleted by hand before running again.
          if out=$(gh release view "v$V" --json tagName 2>&1); then
            echo "::error::A release for v$V already exists; not making a second one."
            exit 1
          elif ! echo "$out" | grep -q "release not found"; then
            echo "::error::Couldn't check for a release for v$V: $out"
            exit 1
          fi
          gh release create "v$V" --draft $PRE --title "Mimic v$V" --notes-file notes.md release-artifacts/*
      - name: Verify uploaded metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.windows.outputs.version }}"
          gh release view "v$V" --json assets -q '.assets[].name' | tee assets.txt
          for f in "Mimic_${V}_x64-setup.exe" "Mimic_${V}_x64-setup.exe.sig" latest.json SHA256SUMS.txt; do
            grep -qx "$f" assets.txt || { echo "missing asset $f"; exit 1; }
          done
          echo "Draft release v$V is complete. Publish with: gh release edit v$V --draft=false --latest"
