[workspace]
resolver = "2"
members = ["crates/mimic-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.10.0-alpha.10"
edition = "2021"
# 1.89: std::fs::File::try_lock, for the one-Mimic-at-a-time lock (instance.rs).
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/the-x1x1/mimic"
authors = ["the-x1x1 <connersalt123@outlook.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# The IMAP connector's TLS: the same rustls and root store reqwest already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tempfile = "3"
mimic-core = { path = "crates/mimic-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
