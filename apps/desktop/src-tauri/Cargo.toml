[package]
name = "mimic-desktop"
description = "Mimic desktop shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "mimic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mimic-core.workspace = true
# `tray-icon`: Mimic keeps running in the notification area (background.rs).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# A second launch hands over to the running Mimic and exits (lib.rs).
tauri-plugin-single-instance = "2"
# Windows notifications, and starting with Windows when asked (background.rs).
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# Answering from anywhere: a global shortcut, and the clipboard (anywhere.rs).
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
anyhow.workspace = true
rand.workspace = true
hex.workspace = true
sha2.workspace = true

# DPAPI, to seal saved credentials to the user's Windows account (secrets.rs);
# DnsQuery_W, for who handles an address's mail (mail_dns.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_NetworkManagement_Dns",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The login Keychain, to seal saved credentials on macOS (secrets.rs). Never
# yet run on a Mac.
[target.'cfg(target_os = "macos")'.dependencies]
mimic-keychain.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The Keychain sealer's own sealing, tested here with a key of the test's.
mimic-keychain.workspace = true
