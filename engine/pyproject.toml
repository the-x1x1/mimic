[project]
name = "mimic-engine"
version = "0.2.0a1"
description = "Mimic ML/image engine: deterministic feature extraction, XMP ingest, Style Brain training and prediction. Runs as a stdio NDJSON sidecar of the Mimic desktop app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "the-x1x1", email = "connersalt123@outlook.com" }]
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=10.4",
  "pydantic>=2.8,<3",
  "exifread>=3.0",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4",
]

[project.optional-dependencies]
raw = ["rawpy>=0.22"]
onnx = ["onnxruntime>=1.18"]
directml = ["onnxruntime-directml>=1.18; sys_platform == 'win32'"]

[project.scripts]
mimic-engine = "mimic_engine.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimic_engine"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
